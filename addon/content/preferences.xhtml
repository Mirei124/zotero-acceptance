<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link
    rel="stylesheet"
    href="chrome://__addonRef__/content/zoteroPane.css"
  />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <vbox id="__addonRef__-journal-list-box"> </vbox>
  <hbox
    ><button
      data-l10n-id="button-add"
      id="zotero-acceptance-button-add"
      class="zotero-acceptance-button"
    ></button>
    <button
      data-l10n-id="button-save"
      id="zotero-acceptance-button-save"
      class="zotero-acceptance-button"
    ></button>
    <button
      data-l10n-id="button-reset"
      id="zotero-acceptance-button-reset"
      class="zotero-acceptance-button"
    ></button
  ></hbox>
</groupbox>
<hr class="zotero-acceptance-sep" />
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
